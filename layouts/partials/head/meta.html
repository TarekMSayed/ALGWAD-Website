{{ $description := .Params.description | default .Params.summary | default .Site.Title }}
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{ .Title }}</title>
<meta name="description" content="{{ $description }}"/>
<link rel="icon" href="{{ "assets/favicon.ico" | absURL }}" sizes="any"/>
<link rel="icon" type="image/png" sizes="32x32" href="{{ "assets/favicon-32x32.png" | absURL }}"/>
<link rel="icon" type="image/png" sizes="16x16" href="{{ "assets/favicon-16x16.png" | absURL }}"/>
<link rel="apple-touch-icon" sizes="180x180" href="{{ "assets/apple-touch-icon.png" | absURL }}"/>
<meta name="theme-color" content="#0d1c32"/>
<link rel="canonical" href="{{ .Permalink }}"/>
<!-- Open Graph -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ALGWAD"/>
<meta property="og:title" content="{{ .Title }}"/>
<meta property="og:description" content="{{ $description }}"/>
<meta property="og:image" content="{{ "assets/og-image.png" | absURL }}"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:url" content="{{ .Permalink }}"/>
<meta property="og:locale" content="{{ .Site.Language.Params.ogLocale }}"/>
{{ range hugo.Sites }}{{ if ne .Language.Lang $.Site.Language.Lang }}<meta property="og:locale:alternate" content="{{ .Language.Params.ogLocale }}"/>{{ end }}{{ end }}
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ .Title }}"/>
<meta name="twitter:description" content="{{ $description }}"/>
<meta name="twitter:image" content="{{ "assets/og-image.png" | absURL }}"/>
