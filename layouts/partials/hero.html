<section class="relative flex items-center justify-center overflow-hidden bg-surface dark:bg-inverse-surface pt-32 md:pt-40 pb-12 md:pb-16">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface/90 dark:to-inverse-surface/90 z-10"></div>
{{ with resources.Get "images/brand-mark.png" }}
<img alt="ALGWAD Hero Background" class="absolute inset-0 w-full h-full object-cover opacity-20 dark:opacity-40 mix-blend-multiply dark:mix-blend-overlay" src="{{ .RelPermalink }}"/>
{{ end }}
<div class="relative z-20 px-margin-mobile md:px-margin-desktop text-center flex flex-col items-center py-10">
<h1 class="font-display-lg md:text-display-lg text-3xl text-on-surface dark:text-surface-bright mb-10 max-w-9xl md:mt-0 mt-8">
<span class="accent-gradient-text font-[Montserrat]" dir="ltr">{{ .Params.heroHighlight }}</span>
<br/> <span class="block md:inline"> {{ .Params.heroRest }}</span>
</h1>
<p class="font-body-md text-xl md:text-2xl text-on-surface-variant dark:text-surface-variant max-w-4xl mx-auto mb-12 leading-relaxed">
{{ .Params.heroSubheading }}
</p>
</div>
</section>
